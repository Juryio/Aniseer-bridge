[tool.poetry]
name = "jellyseerr-aniworld-bridge"
version = "0.1.0"
description = "A bridge between Jellyseerr and AniWorld Downloader"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
requests = "^2.31.0"
aniworld = {git = "https://github.com/phoenixthrush/AniWorld-Downloader.git", rev = "10d10ff2a9e928c52350c5cd6b09d38b2f830fa9"}
sqlalchemy = "^2.0.23"
jinja2 = "^3.1.2"
pydantic-settings = "^2.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
httpx = "^0.25.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
